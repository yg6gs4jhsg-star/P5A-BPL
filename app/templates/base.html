<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BluePrintLab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="site" href="{{ url_for('projects.home') }}">BluePrintLab</a>
    <a href="{{ url_for('projects.project_list') }}">Projets</a>
    <a href="{{ url_for('projects.information') }}">Informations</a>
    <a href="{{ url_for('projects.my_space') }}">Mon espace</a>
    {% if current_user.is_authenticated %}
      <form method="post" action="{{ url_for('accounts.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button>Se déconnecter</button>
      </form>
    {% else %}
      <a href="{{ url_for('accounts.login') }}">Se connecter</a>
    {% endif %}
  </header>
  <main>
    {% for confirmation in get_flashed_messages() %}<p class="confirmation">{{ confirmation }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
