{# Un formulaire POST protégé vers /projets/<adresse>/<action>. #}
{% macro action_form(project, action, label) %}
<form method="post" action="{{ url_for('projects.project_action', slug=project.slug, action=action) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {{ caller() if caller else "" }}
  <button>{{ label }}</button>
</form>
{% endmacro %}
